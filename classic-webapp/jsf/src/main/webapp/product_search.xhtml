<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head><title>Search - ES</title></h:head>
<h:body>
    <h:form>
        <h:inputText value="#{productSearchBean.q}"/>
        <h:commandButton value="Search" action="#{productSearchBean.search}"/>
    </h:form>

    <h:dataTable value="#{productSearchBean.results}" var="product">
        <h:column>
            <f:facet name="header">Code</f:facet>
            #{product.productCode}
        </h:column>
        <h:column>
            <f:facet name="header">Name</f:facet>
            #{product.productName}
        </h:column>
        <h:column>
            <f:facet name="header">Line</f:facet>
            #{product.productLine}
        </h:column>
    </h:dataTable>
</h:body>
</html>

<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets" template="/WEB-INF/templates/layout.xhtml">
    <ui:param name="activePage" value="products" />
    <ui:define name="title">
        Products
    </ui:define>

    <ui:define name="head">
        <h:outputStylesheet library="css" name="marks.css" />
        <script src="https://cdn.jsdelivr.net/mark.js/8.6.0/mark.min.js"></script>
    </ui:define>

    <ui:define name="content">

        <h2 class="text-xl font-semibold my-2">Search Products</h2>

        <h:form class="flex items-center gap-4">
            <h:inputText value="#{productBean.q}" placeholder="Search products" class="input input-bordered" />

            <label class="label cursor-pointer gap-2">

                <h:selectBooleanCheckbox value="#{productBean.es}" class="checkbox" />
                <h:outputText value=" Use Elasticsearch" />
            </label>

            <h:commandButton value="Search" action="#{productBean.load}" class="btn btn-primary" />
        </h:form>


        <p>Total: #{productBean.products.size()}</p>

        <table id="results" class="table" data-query="#{productBean.q}">
            <thead class="sticky top-0 bg-base-100">
                <tr class="border-b">
                    <th>Product Code</th>
                    <th>Product Line</th>
                    <th>Product Name</th>
                    <th>Product Description</th>
                </tr>
            </thead>

            <tbody>
                <ui:repeat value="#{productBean.products}" var="product">
                    <tr class="border-b">
                        <td>#{product.productCode}</td>

                        <td class="no-highlight">
                            #{product.productLine}
                        </td>

                        <td>
                            <h:outputText value="#{product.productName}" escape="false" />
                        </td>

                        <td>
                            <h:outputText value="#{product.productDescription}" escape="false" />
                        </td>
                    </tr>
                </ui:repeat>
            </tbody>
        </table>

        <h:outputScript library="js" name="marks.js" target="body" rendered="#{not productBean.es}" />
    </ui:define>

</ui:composition>

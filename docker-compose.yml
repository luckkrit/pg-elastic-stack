
services:

  # =====================================================
  # Elasticsearch
  # =====================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    container_name: elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g

    ports:
      - "127.0.0.1:9200:9200"

    volumes:
      - esdata:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s


  # =====================================================
  # Kibana
  # =====================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.3
    container_name: kibana

    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - NODE_OPTIONS=--max-old-space-size=768
      - INTERACTIVESETUP_ENABLED=false

    ports:
      - "127.0.0.1:5601:5601"

    depends_on:
      elasticsearch:
        condition: service_healthy


  # =====================================================
  # PostgreSQL + PostGIS
  # =====================================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: postgres

    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb/classicmodels.sql:/docker-entrypoint-initdb.d/20_classicmodels.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s


  # =====================================================
  # pgAdmin 4
  # =====================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin

    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin

    ports:
      - "127.0.0.1:5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy


  # =====================================================
  # Java Migration Application
  # PostgreSQL -> Elasticsearch
  # =====================================================
  migrate:
    build: ./migrate
    container_name: migrate

    environment:
      - PG_URL=jdbc:postgresql://postgres:5432/postgres
      - PG_USERNAME=postgres
      - PG_PASSWORD=password
      - ES_URL=http://elasticsearch:9200

    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

    # Run manually:
    # docker compose run --rm migrate
    profiles:
      - tools

  webapp:
    build: ./webapp
    container_name: webapp
    environment:
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

# =====================================================
# Persistent Volumes
# =====================================================
volumes:
  esdata:
  pgdata:
  pgadmin_data:
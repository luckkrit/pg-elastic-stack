<!-- templates/layout.html -->
<html th:fragment="layout(title,activePage, content)" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body>
    <div th:replace="~{fragments/navbar :: navbar(${activePage})}"></div>
    <div class="pt-[80px] px-4">
        <th:block th:replace="${content}"></th:block>
    </div>
</body>
</html>

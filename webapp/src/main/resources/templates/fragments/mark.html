<style>
    mark {
        background-color: #000;
        color: #fff;
    }
</style>
<script th:inline="javascript">
    const query = /*[[${q}]]*/ '';
    const words = query.trim().split(/\s+/).filter(w => w.length > 0);
    if (words.length > 0) {
        new Mark(document.querySelector('#results')).mark(words, { exclude: [".no-highlight"] });
    }
</script>
